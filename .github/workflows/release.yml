# Publica uma versão para o evento. Para gerar: crie uma tag "v2.0.0" e envie
# (git tag v2.0.0 && git push origin v2.0.0). A página de Releases do GitHub
# recebe o instalador, o executável portátil e o pacote web (atalho + HTML).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run test
      - run: npm run app:build

      - name: Monta os arquivos da versão
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pacote/web/dist | Out-Null
          Copy-Item dist/index.html pacote/web/dist/
          Copy-Item INICIAR_EVENTO.bat pacote/web/
          Compress-Archive -Path pacote/web/* -DestinationPath pacote/InvasaoExe-web.zip
          Copy-Item src-tauri/target/release/invasao-exe.exe pacote/InvasaoExe-portatil.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe pacote/

      - uses: actions/upload-artifact@v4
        with:
          name: versao
          path: pacote/*.*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            pacote/InvasaoExe-web.zip
            pacote/InvasaoExe-portatil.exe
            pacote/*setup.exe
