[package]
name = "invasao-exe"
version = "4.0.0"
description = "INVASÃO.EXE — RPG de digitação hacker (app de desktop do evento)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# executável menor e mais rápido
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
